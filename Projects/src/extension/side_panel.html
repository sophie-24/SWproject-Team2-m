<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechVisibility 검색 분석</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif;
      background: #0f0f0f;
      color: #f1f1f1;
      min-height: 100vh;
      font-size: 13px;
    }

    /* ── 헤더 ── */
    .header {
      background: #1a1a1a;
      border-bottom: 1px solid #2a2a2a;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .logo { font-weight: 800; color: #ff4444; font-size: 0.95rem; }
    .keyword-badge {
      background: #2a2a2a;
      border: 1px solid #3a3a3a;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 0.75rem;
      color: #ccc;
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── 로딩 ── */
    .loading {
      padding: 32px 16px;
      text-align: center;
    }
    .loading-steps { display: flex; flex-direction: column; gap: 14px; }
    .step-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      transition: all 0.3s;
    }
    .step-row.active  { border-color: #ff4444; background: #1f1010; }
    .step-row.done    { border-color: #44cc66; background: #0f1f14; }
    .step-icon { font-size: 1rem; width: 20px; text-align: center; }
    .step-label { font-size: 0.82rem; color: #aaa; }
    .step-row.active .step-label { color: #ff4444; }
    .step-row.done  .step-label { color: #44cc66; }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid #333;
      border-top-color: #ff4444;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    /* ── 에러 ── */
    .error-box {
      margin: 24px 16px;
      background: #1f1010;
      border: 1px solid #cc3333;
      border-radius: 10px;
      padding: 16px;
      text-align: center;
    }
    .error-box .err-icon { font-size: 1.8rem; margin-bottom: 8px; }
    .error-box .err-msg  { color: #ff6666; font-size: 0.85rem; line-height: 1.6; }
    .error-box .err-sub  { color: #666; font-size: 0.75rem; margin-top: 6px; }
    .btn-retry {
      margin-top: 12px;
      padding: 8px 20px;
      background: #ff4444;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.82rem;
    }
    .btn-retry:hover { background: #cc2222; }

    /* ── 결과 영역 ── */
    #results { display: none; padding: 12px; }

    /* 영상 카드 */
    .video-card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      margin-bottom: 10px;
      overflow: hidden;
    }
    .video-card-header {
      display: flex;
      gap: 10px;
      padding: 10px 12px;
      align-items: flex-start;
    }
    .video-thumb {
      width: 72px;
      height: 46px;
      object-fit: cover;
      border-radius: 4px;
      flex-shrink: 0;
      background: #222;
    }
    .video-meta { flex: 1; min-width: 0; }
    .video-title {
      font-size: 0.8rem;
      font-weight: 600;
      color: #eee;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 5px;
    }
    .video-title a { color: inherit; text-decoration: none; }
    .video-title a:hover { color: #ff4444; }
    .video-badges { display: flex; gap: 5px; flex-wrap: wrap; }
    .badge {
      font-size: 0.68rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }
    .badge.ad       { background: #2a1010; color: #ff5555; border: 1px solid #441111; }
    .badge.no-ad    { background: #0f1f14; color: #44cc66; border: 1px solid #1a3a22; }
    .badge.cred     { background: #111827; color: #6699ff; border: 1px solid #1e2d4a; }

    .video-summary {
      font-size: 0.75rem;
      color: #888;
      padding: 0 12px 10px;
      line-height: 1.6;
    }

    /* 섹션 블록 */
    .section-block {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .section-title {
      font-size: 0.72rem;
      font-weight: 700;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .fact-item, .controversy-item {
      font-size: 0.78rem;
      color: #ccc;
      padding: 5px 0;
      border-bottom: 1px solid #222;
      line-height: 1.5;
    }
    .fact-item:last-child, .controversy-item:last-child { border-bottom: none; }
    .fact-item::before       { content: "✓ "; color: #44cc66; }
    .controversy-item::before { content: "⚡ "; color: #ffaa44; }

    /* 로그인 필요 */
    .login-needed {
      margin: 32px 16px;
      text-align: center;
    }
    .login-needed p { color: #888; font-size: 0.85rem; line-height: 1.8; }
    .btn-login {
      margin-top: 14px;
      padding: 10px 24px;
      background: #ff4444;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 600;
    }
    .btn-login:hover { background: #cc2222; }

    /* 키워드 없음 */
    .no-keyword {
      margin: 32px 16px;
      text-align: center;
      color: #555;
      font-size: 0.85rem;
      line-height: 1.8;
    }
    .no-keyword span { font-size: 2rem; display: block; margin-bottom: 10px; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- 헤더 -->
  <div class="header">
    <div class="logo">✦ TechVisibility</div>
    <div class="keyword-badge" id="keyword-badge">분석 중...</div>
  </div>

  <!-- 로그인 필요 -->
  <div id="login-needed" class="login-needed hidden">
    <p>🔒<br>AI 분석을 보려면<br>로그인이 필요합니다.</p>
    <button class="btn-login" id="btn-login">Google 로그인</button>
  </div>

  <!-- 키워드 없음 -->
  <div id="no-keyword" class="no-keyword hidden">
    <span>🔍</span>
    유튜브에서 검색하면<br>
    AI 분석이 시작됩니다.
  </div>

  <!-- 로딩 -->
  <div id="loading" class="loading">
    <div class="loading-steps">
      <div class="step-row" id="s1">
        <span class="step-icon">🔍</span>
        <span class="step-label">영상 검색 중...</span>
      </div>
      <div class="step-row" id="s2">
        <span class="step-icon">📝</span>
        <span class="step-label">자막 분석 중...</span>
      </div>
      <div class="step-row" id="s3">
        <span class="step-icon">🤖</span>
        <span class="step-label">AI 교차 분석 중...</span>
      </div>
    </div>
  </div>

  <!-- 에러 -->
  <div id="error-box" class="error-box hidden">
    <div class="err-icon">⚠️</div>
    <div class="err-msg" id="err-msg">분석 중 오류가 발생했습니다.</div>
    <div class="err-sub" id="err-sub"></div>
    <button class="btn-retry" id="btn-retry">다시 시도</button>
  </div>

  <!-- 결과 -->
  <div id="results">
    <div id="videos-section"></div>
    <div id="common-section"></div>
    <div id="controversy-section"></div>
  </div>

  <script>
    const API = "http://localhost:8000";

    // ── 상태 변수 ──────────────────────────────────────────────
    let currentKeyword = "";
    let currentJwt     = "";

    // ── 유틸 ──────────────────────────────────────────────────
    function esc(s) {
      return String(s ?? "")
        .replace(/&/g,"&amp;").replace(/</g,"&lt;")
        .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    function setStep(n, state) {
      const el = document.getElementById(`s${n}`);
      if (!el) return;
      el.classList.remove("active","done");
      if (state) el.classList.add(state);
      const icon = el.querySelector(".step-icon");
      if (state === "active") icon.innerHTML = `<span class="spinner"></span>`;
      if (state === "done")   icon.textContent = "✅";
      if (!state)             icon.textContent = ["","🔍","📝","🤖"][n];
    }

    function showError(msg, sub = "") {
      document.getElementById("loading").classList.add("hidden");
      document.getElementById("results").style.display = "none";
      const box = document.getElementById("error-box");
      box.classList.remove("hidden");
      document.getElementById("err-msg").textContent = msg;
      document.getElementById("err-sub").textContent = sub;
    }

    // ── 메인 분석 ─────────────────────────────────────────────
    async function analyze(keyword, jwt) {
      currentKeyword = keyword;
      currentJwt     = jwt;

      document.getElementById("keyword-badge").textContent = `"${keyword}"`;
      document.getElementById("loading").classList.remove("hidden");
      document.getElementById("error-box").classList.add("hidden");
      document.getElementById("results").style.display = "none";
      setStep(1,"active"); setStep(2,""); setStep(3,"");

      let data;
      try {
        // Step 1 → 2 애니메이션
        await new Promise(r => setTimeout(r, 600));
        setStep(1,"done"); setStep(2,"active");
        await new Promise(r => setTimeout(r, 600));
        setStep(2,"done"); setStep(3,"active");

        const res = await fetch(
          `${API}/analyze_search?keyword=${encodeURIComponent(keyword)}`,
          { headers: { "Authorization": `Bearer ${jwt}` } }
        );

        if (res.status === 401) {
          showError("세션이 만료됐습니다.", "팝업에서 다시 로그인해주세요.");
          return;
        }
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          showError(err.detail || `서버 오류 (${res.status})`, "잠시 후 다시 시도해주세요.");
          return;
        }
        data = await res.json();
      } catch (e) {
        showError("백엔드에 연결할 수 없습니다.", "백엔드 서버가 실행 중인지 확인하세요.");
        return;
      }

      setStep(3,"done");
      await new Promise(r => setTimeout(r, 300));
      document.getElementById("loading").classList.add("hidden");
      renderResults(data);
    }

    // ── 결과 렌더링 ──────────────────────────────────────────
    function renderResults(data) {
      const videos       = data.videos || [];
      const commonFacts  = data.common_facts || [];
      const controversies= data.controversies || [];

      // ── 영상 카드 ──
      const videosHTML = videos.map(v => {
        const adBadge = v.ad_detected
          ? `<span class="badge ad">광고 포함</span>`
          : `<span class="badge no-ad">광고 없음</span>`;
        const credBadge = v.credibility_score != null
          ? `<span class="badge cred">신뢰도 ${Math.round(v.credibility_score * 100)}%</span>`
          : "";
        const thumb = v.thumbnail_url
          ? `<img class="video-thumb" src="${esc(v.thumbnail_url)}" alt="">`
          : `<div class="video-thumb" style="display:flex;align-items:center;justify-content:center;color:#444;">▶</div>`;

        return `
        <div class="video-card">
          <div class="video-card-header">
            ${thumb}
            <div class="video-meta">
              <div class="video-title">
                <a href="https://youtube.com/watch?v=${esc(v.video_id)}" target="_blank">${esc(v.title)}</a>
              </div>
              <div class="video-badges">${adBadge}${credBadge}</div>
            </div>
          </div>
          ${v.summary ? `<div class="video-summary">${esc(v.summary)}</div>` : ""}
        </div>`;
      }).join("");

      document.getElementById("videos-section").innerHTML = videosHTML;

      // ── 공통 사실 ──
      if (commonFacts.length) {
        document.getElementById("common-section").innerHTML = `
        <div class="section-block">
          <div class="section-title">📋 공통 사실</div>
          ${commonFacts.map(f => `<div class="fact-item">${esc(f)}</div>`).join("")}
        </div>`;
      }

      // ── 쟁점 ──
      if (controversies.length) {
        document.getElementById("controversy-section").innerHTML = `
        <div class="section-block">
          <div class="section-title">⚡ 쟁점</div>
          ${controversies.map(c => `<div class="controversy-item">${esc(c)}</div>`).join("")}
        </div>`;
      }

      document.getElementById("results").style.display = "block";
    }

    // ── 초기화 ──────────────────────────────────────────────
    document.getElementById("btn-retry").addEventListener("click", () => {
      if (currentKeyword && currentJwt) analyze(currentKeyword, currentJwt);
    });

    document.getElementById("btn-login").addEventListener("click", () => {
      chrome.tabs.create({ url: `${API}/auth/login` });
    });

    (async function init() {
      // JWT 확인
      const { jwt, loggedIn } = await new Promise(r =>
        chrome.storage.local.get(["jwt","loggedIn"], r)
      );

      if (!jwt || !loggedIn) {
        document.getElementById("loading").classList.add("hidden");
        document.getElementById("login-needed").classList.remove("hidden");
        return;
      }

      // 현재 탭 URL에서 키워드 추출
      const tabs = await new Promise(r =>
        chrome.tabs.query({ active: true, currentWindow: true }, r)
      );
      const tab = tabs[0];
      let keyword = "";
      try {
        const u = new URL(tab?.url || "");
        if (u.hostname.includes("youtube.com") && u.pathname === "/results") {
          keyword = u.searchParams.get("search_query") || "";
        }
      } catch {}

      if (!keyword) {
        document.getElementById("loading").classList.add("hidden");
        document.getElementById("no-keyword").classList.remove("hidden");
        return;
      }

      analyze(keyword, jwt);
    })();
  </script>
</body>
</html>
