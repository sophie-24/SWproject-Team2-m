<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tubify</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Noto Sans KR", "Segoe UI", sans-serif;
      background: #f7f9fb;
      color: #191c1e;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-size: 13px;
    }

    /* ── 헤더 ── */
    .header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid #f2f4f6;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px 1px 16px;
      flex-shrink: 0;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-logo-box {
      width: 32px;
      height: 32px;
      background: red;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .header-logo-box svg {
      width: 13.5px;
      height: 13.5px;
      fill: #fff;
    }

    .header-brand-text {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .header-title {
      font-size: 15px;
      font-weight: 700;
      color: #191c1e;
      line-height: 1;
      letter-spacing: -0.3px;
    }

    .header-subtitle {
      font-size: 9px;
      font-weight: 500;
      color: #515f74;
      letter-spacing: 1px;
      text-transform: uppercase;
      line-height: 1;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
      border-radius: 9999px;
      color: #515f74;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
      line-height: 1;
    }

    .icon-btn:hover {
      background: #f2f4f6;
      color: #191c1e;
    }

    .icon-btn svg {
      width: 15px;
      height: 15px;
    }

    /* ── 바디 레이아웃 ── */
    .body-wrap {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── 사이드 탭 네비 ── */
    .tab-nav {
      width: 64px;
      background: #f8fafc;
      border-right: 1px solid rgba(226, 232, 240, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 0;
      flex-shrink: 0;
      gap: 4px;
    }

    .tab-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 10px 4px;
      background: none;
      border: none;
      border-right: 3px solid transparent;
      border-radius: 2px 0 0 2px;
      cursor: pointer;
      width: 100%;
      transition: background 0.15s, border-color 0.15s;
    }

    .tab-btn:hover { background: rgba(0, 0, 0, 0.04); }

    .tab-btn.active {
      border-right-color: red;
      background: rgba(255, 0, 0, 0.06);
    }

    .tab-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #94a3b8;
      transition: color 0.15s;
    }

    .tab-icon svg { width: 18px; height: 18px; }
    .tab-btn.active .tab-icon { color: red; }

    .tab-label {
      font-size: 7px;
      font-weight: 800;
      color: #94a3b8;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      line-height: 1;
      transition: color 0.15s;
    }

    .tab-btn.active .tab-label { color: red; }
    .tab-nav-spacer { flex: 1; }

    /* ── 콘텐츠 영역 ── */
    .content-wrap {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      background: #fff;
    }

    .content-wrap::-webkit-scrollbar { width: 4px; }
    .content-wrap::-webkit-scrollbar-track { background: transparent; }
    .content-wrap::-webkit-scrollbar-thumb { background: #e6e8ea; border-radius: 2px; }

    .tab-panel {
      display: none;
      padding: 20px 16px;
    }

    .tab-panel.active { display: block; }

    /* ── 단일 영상 요약 섹션 ── */
    .video-summary-section {
      margin-bottom: 4px;
    }

    .video-sum-title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .video-sum-title {
      font-size: 22px;
      font-weight: 900;
      color: #191c1e;
      letter-spacing: -0.55px;
      line-height: 1.25;
      flex: 1;
      word-break: keep-all;
    }

    /* ── 관련 영상 분석 구분선 ── */
    .related-section-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 22px 0 16px;
    }

    .related-divider-line {
      flex: 1;
      height: 1px;
      background: #e6e8ea;
    }

    .related-section-label {
      font-size: 10px;
      font-weight: 700;
      color: #94a3b8;
      letter-spacing: 1px;
      text-transform: uppercase;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ── 키워드 타이틀 ── */
    .keyword-title {
      font-size: 24px;
      font-weight: 900;
      color: #191c1e;
      letter-spacing: -0.6px;
      line-height: 1.25;
      margin-bottom: 8px;
      word-break: keep-all;
      flex: 1;
    }

    .keyword-underline {
      width: 48px;
      height: 4px;
      background: red;
      border-radius: 9999px;
      margin-bottom: 20px;
    }

    .keyword-title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    /* ── 섹션 카드 ── */
    .section-block {
      background: #f2f4f6;
      border-radius: 12px;
      padding: 18px 18px 18px 22px;
      margin-bottom: 12px;
      border-left: 4px solid transparent;
    }

    .section-block.border-red { border-left-color: red; }
    .section-block.border-gray { border-left-color: #515f74; }
    .section-block.border-yellow { border-left-color: #f59e0b; }
    .section-block.border-green { border-left-color: #16a34a; }

    .section-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .section-icon-box {
      width: 15px;
      height: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
    }

    .section-icon-box svg { width: 15px; height: 15px; }

    .icon-red    { color: red; }
    .icon-blue   { color: #515f74; }
    .icon-gray   { color: #515f74; }
    .icon-yellow { color: #f59e0b; }
    .icon-green  { color: #16a34a; }

    .section-title-text {
      font-size: 14px;
      font-weight: 700;
      color: #191c1e;
      line-height: 1.4;
    }

    .section-body-text {
      font-size: 13px;
      color: #603e39;
      line-height: 1.65;
    }

    /* ── 불릿 리스트 ── */
    .bullet-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .bullet-item {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      font-size: 13px;
      color: #603e39;
      line-height: 1.65;
    }

    .bullet-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      margin-top: 6px;
      flex-shrink: 0;
    }

    .dot-red    { background: red; }
    .dot-blue   { background: #515f74; }
    .dot-yellow { background: #f59e0b; }

    /* ── 결론 박스 ── */
    .conclusion-box {
      background: #f2f4f6;
      border-left: 4px solid red;
      border-radius: 0 8px 8px 0;
      padding: 12px 14px;
      margin-bottom: 12px;
      font-size: 13px;
      color: #515f74;
      line-height: 1.65;
    }

    /* ── 소스 섹션 ── */
    .source-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 8px;
    }

    .source-title-text {
      font-size: 14px;
      font-weight: 700;
      color: #191c1e;
      border-bottom: 2px solid red;
      padding-bottom: 4px;
    }

    .view-all-btn {
      font-size: 10px;
      font-weight: 600;
      color: #515f74;
      background: none;
      border: none;
      cursor: pointer;
      letter-spacing: -0.5px;
      text-transform: uppercase;
    }

    .view-all-btn:hover { color: #191c1e; }

    /* ── 비디오 카드 ── */
    .video-card { margin-bottom: 16px; }
    .video-card:last-child { margin-bottom: 0; }

    .video-card-inner {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .video-thumb-wrap {
      position: relative;
      width: 96px;
      flex-shrink: 0;
    }

    .video-thumb {
      width: 96px;
      aspect-ratio: 16/9;
      object-fit: cover;
      border-radius: 6px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.08);
      display: block;
    }

    .video-thumb-placeholder {
      width: 96px;
      aspect-ratio: 16/9;
      border-radius: 6px;
      background: #e6e8ea;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #94a3b8;
      font-size: 18px;
      flex-shrink: 0;
    }

    .video-info { flex: 1; min-width: 0; }

    .video-title-text {
      font-size: 12px;
      font-weight: 500;
      color: #191c1e;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
      text-overflow: ellipsis;
      word-break: break-word;
      margin-bottom: 4px;
      text-decoration: none;
    }

    .video-title-text:hover { color: red; }

    .video-subtitle {
      font-size: 11px;
      color: #515f74;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 6px;
    }

    .video-meta-row {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      align-items: center;
    }

    .channel-badge {
      font-size: 9px;
      font-weight: 500;
      color: #515f74;
      text-transform: uppercase;
      letter-spacing: -0.25px;
    }

    .badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }

    .badge-ad   { background: #fee2e2; color: #dc2626; }
    .badge-noad { background: #dcfce7; color: #16a34a; }
    .badge-cred { background: #eff6ff; color: #2563eb; }
    .badge-ad-score { background: #fff7ed; color: #ea580c; }

    /* ── 로딩 ── */
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50%       { opacity: 1;   transform: scale(1); }
    }

    .loading-container { padding: 28px 20px 20px; }

    .loading-kw {
      font-size: 20px;
      font-weight: 700;
      color: #191c1e;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
      line-height: 1.3;
      word-break: keep-all;
    }

    .loading-sub {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .loading-dots { display: flex; gap: 3px; align-items: center; }
    .loading-dots span {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #94a3b8;
      display: inline-block;
      animation: pulse-dot 1.2s ease-in-out infinite;
    }
    .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

    .step-list { display: flex; flex-direction: column; gap: 8px; }

    .step-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border-radius: 12px;
      background: #f8fafc;
      border: 1.5px solid #f0f2f5;
      transition: background 0.3s, border-color 0.3s;
    }

    .step-item.active { background: #fff8f8; border-color: rgba(255, 0, 0, 0.12); }
    .step-item.done   { background: #f0fdf4; border-color: rgba(22, 163, 74, 0.15); }

    .step-indicator {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: #e9ecef;
      transition: background 0.3s;
    }

    .step-item.active .step-indicator { background: rgba(255,0,0,0.08); }
    .step-item.done  .step-indicator  { background: rgba(22,163,74,0.12); }

    .step-num { font-size: 13px; font-weight: 700; color: #b0b8c4; }

    .step-ring {
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(255,0,0,0.2);
      border-top-color: red;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    .step-content { flex: 1; min-width: 0; }

    .step-label {
      font-size: 13px;
      font-weight: 600;
      color: #b0b8c4;
      transition: color 0.3s;
      line-height: 1.4;
    }

    .step-item.active .step-label { color: #ff0000; }
    .step-item.done  .step-label  { color: #16a34a; }

    .step-desc {
      font-size: 11px;
      color: #c8d0da;
      margin-top: 2px;
      transition: color 0.3s;
    }

    .step-item.active .step-desc { color: rgba(255,0,0,0.45); }
    .step-item.done  .step-desc  { color: rgba(22,163,74,0.55); }

    /* ── 상태 화면 ── */
    .state-screen {
      padding: 48px 20px;
      text-align: center;
      color: #515f74;
      font-size: 14px;
      line-height: 1.8;
    }

    .state-screen .icon {
      font-size: 2rem;
      display: block;
      margin-bottom: 12px;
    }

    .btn-primary {
      margin-top: 16px;
      padding: 10px 24px;
      background: red;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      transition: background 0.15s;
    }

    .btn-primary:hover { background: #cc0000; }

    .btn-retry {
      margin-top: 12px;
      padding: 8px 20px;
      background: #fff;
      color: red;
      border: 1px solid rgba(255, 0, 0, 0.3);
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      transition: background 0.15s;
    }

    .btn-retry:hover { background: #fff5f5; }

    .error-msg { color: #dc2626; font-size: 13px; line-height: 1.6; font-weight: 600; }
    .error-sub { color: #515f74; font-size: 12px; margin-top: 4px; }

    .hidden { display: none !important; }

    /* ── 캐시 안내 ── */
    .cache-notice {
      margin-bottom: 12px;
      padding: 6px 12px;
      border-radius: 8px;
      background: #f2f4f6;
      border: 1px solid #e6e8ea;
      font-size: 11px;
      color: #515f74;
    }

    /* ── 하트 버튼 ── */
    .btn-heart {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 4px;
      transition: transform 0.15s;
    }

    .btn-heart:hover  { transform: scale(1.15); }
    .btn-heart:active { transform: scale(0.9); }

    .btn-heart svg {
      width: 22px;
      height: 22px;
      transition: fill 0.2s, stroke 0.2s;
    }

    .btn-heart.hearted svg { fill: red; stroke: red; }
    .btn-heart:not(.hearted) svg { fill: none; stroke: #aaa; }

    /* ── 토스트 ── */
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: #191c1e;
      color: #fff;
      font-size: 12px;
      font-weight: 500;
      padding: 9px 16px;
      border-radius: 9999px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 9999;
      max-width: 90%;
      text-align: center;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── 소스 프리뷰 ── */
    .sources-in-insights { margin-top: 8px; }

    .source-card-compact {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 16px;
    }

    .source-card-compact:last-child { margin-bottom: 0; }

    .source-thumb-compact { width: 96px; flex-shrink: 0; }

    .source-thumb-compact img {
      width: 96px;
      aspect-ratio: 16/9;
      object-fit: cover;
      border-radius: 6px;
      display: block;
      box-shadow: 0 1px 2px rgba(0,0,0,0.08);
    }

    .source-thumb-placeholder-compact {
      width: 96px;
      aspect-ratio: 16/9;
      border-radius: 6px;
      background: #e6e8ea;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #94a3b8;
      font-size: 16px;
    }

    .source-info-compact { flex: 1; min-width: 0; }

    .source-title-compact {
      font-size: 12px;
      font-weight: 500;
      color: #191c1e;
      line-height: 1.45;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
      text-overflow: ellipsis;
      text-decoration: none;
      margin-bottom: 4px;
    }

    .source-title-compact:hover { color: red; }

    .source-channel-compact {
      font-size: 9px;
      font-weight: 500;
      color: #515f74;
      text-transform: uppercase;
      letter-spacing: -0.25px;
    }
  </style>
</head>

<body>

  <!-- 헤더 -->
  <div class="header">
    <div class="header-brand">
      <div class="header-logo-box">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="3" width="18" height="3" rx="1"/>
          <rect x="3" y="9" width="11" height="2" rx="1"/>
          <rect x="3" y="13" width="11" height="2" rx="1"/>
          <rect x="3" y="17" width="7" height="2" rx="1"/>
        </svg>
      </div>
      <div class="header-brand-text">
        <span class="header-title">Tubify</span>
        <span class="header-subtitle">THE INTELLIGENT CURATOR</span>
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="btn-refresh" title="새로고침">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- 로그인 필요 -->
  <div id="screen-login" class="state-screen hidden">
    <span class="icon">🔒</span>
    AI 분석을 보려면<br>로그인이 필요합니다.
    <br><button class="btn-primary" id="btn-login">Google 로그인</button>
  </div>

  <!-- 유튜브에서 검색 유도 -->
  <div id="screen-empty" class="state-screen hidden">
    <span class="icon">🔍</span>
    유튜브에서 영상을 보거나<br>검색하면 AI 분석이 시작됩니다.
  </div>

  <!-- 로딩 -->
  <div id="screen-loading" class="hidden">
    <div class="loading-container">
      <div class="loading-kw" id="loading-kw">분석 중</div>
      <div class="loading-sub">
        AI가 열심히 분석하고 있어요
        <div class="loading-dots">
          <span></span><span></span><span></span>
        </div>
      </div>
      <div class="step-list">
        <div class="step-item" id="s1">
          <div class="step-indicator" id="s1-icon"><span class="step-num">1</span></div>
          <div class="step-content">
            <div class="step-label" id="s1-label">영상 검색</div>
            <div class="step-desc" id="s1-desc">관련 유튜브 영상 수집 중</div>
          </div>
        </div>
        <div class="step-item" id="s2">
          <div class="step-indicator" id="s2-icon"><span class="step-num">2</span></div>
          <div class="step-content">
            <div class="step-label" id="s2-label">자막 분석</div>
            <div class="step-desc" id="s2-desc">각 영상의 자막 처리 중</div>
          </div>
        </div>
        <div class="step-item" id="s3">
          <div class="step-indicator" id="s3-icon"><span class="step-num">3</span></div>
          <div class="step-content">
            <div class="step-label" id="s3-label">AI 교차 분석</div>
            <div class="step-desc" id="s3-desc">영상 간 핵심 내용 비교 중</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 오류 -->
  <div id="screen-error" class="state-screen hidden">
    <span class="icon">⚠️</span>
    <div class="error-msg" id="err-msg">분석 중 오류가 발생했습니다.</div>
    <div class="error-sub" id="err-sub"></div>
    <button class="btn-retry" id="btn-retry">다시 시도</button>
  </div>

  <!-- 결과 -->
  <div id="screen-results" class="body-wrap hidden">

    <!-- 사이드 탭 네비 -->
    <div class="tab-nav">
      <button class="tab-btn active" data-tab="summary" title="서머리">
        <span class="tab-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
          </svg>
        </span>
        <span class="tab-label">SUMMARY</span>
      </button>
      <button class="tab-btn" data-tab="insights" title="인사이트">
        <span class="tab-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </span>
        <span class="tab-label">INSIGHTS</span>
      </button>
      <button class="tab-btn" data-tab="sources" title="소스">
        <span class="tab-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
          </svg>
        </span>
        <span class="tab-label">SOURCES</span>
      </button>
      <div class="tab-nav-spacer"></div>
      <button class="tab-btn" title="설정" id="btn-settings">
        <span class="tab-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </span>
        <span class="tab-label">SETTINGS</span>
      </button>
    </div>

    <!-- 콘텐츠 -->
    <div class="content-wrap">

      <!-- SUMMARY 탭 -->
      <div id="tab-summary" class="tab-panel active">
        <!-- 제목 + 하트 -->
        <div id="kw-header-row" class="keyword-title-row">
          <div class="keyword-title" id="kw-title-s">-</div>
          <button class="btn-heart" id="btn-heart" title="관심 토픽으로 저장">
            <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
            </svg>
          </button>
        </div>
        <div class="keyword-underline" id="kw-underline"></div>
        <!-- 분석 카드: watch 모드 → 단일 영상 AI 분석, search 모드 → 키워드 요약 -->
        <div id="summary-content"></div>
      </div>

      <!-- INSIGHTS 탭 -->
      <div id="tab-insights" class="tab-panel">
        <!-- search 모드 키워드 헤더 (watch 모드에서는 숨김) -->
        <div id="insights-kw-header" class="keyword-title-row" style="display:none;">
          <div class="keyword-title" id="kw-title-insights">-</div>
          <button class="btn-heart" id="btn-heart-insights" title="관심 토픽으로 저장">
            <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
            </svg>
          </button>
        </div>
        <div id="insights-kw-underline" class="keyword-underline" style="display:none;margin-bottom:20px;"></div>
        <div id="insights-sections"></div>
        <div id="controversy-section"></div>
        <div id="sources-in-insights" class="sources-in-insights hidden">
          <div class="source-header">
            <span class="source-title-text">주요 소스</span>
            <button class="view-all-btn" id="btn-view-all">VIEW ALL</button>
          </div>
          <div id="sources-preview"></div>
        </div>
      </div>

      <!-- SOURCES 탭 -->
      <div id="tab-sources" class="tab-panel">
        <div class="source-header">
          <span class="source-title-text">주요 소스</span>
        </div>
        <div id="sources-list"></div>
      </div>

    </div>
  </div>

  <!-- 토스트 -->
  <div class="toast" id="toast"></div>

  <script src="config.js"></script>
  <script src="side_panel.js"></script>
</body>

</html>
