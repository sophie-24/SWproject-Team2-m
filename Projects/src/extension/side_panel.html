<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tubify</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif;
      background: #111;
      color: #f1f1f1;
      min-height: 100vh;
      font-size: 13px;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #1a1a1a;
      border-bottom: 1px solid #2a2a2a;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .logo {
      font-weight: 800;
      color: #ff4444;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
    }

    .logo-sub {
      font-size: 0.6rem;
      color: #555;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .icon-btn {
      background: none;
      border: none;
      color: #555;
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      font-size: 0.9rem;
      transition: color 0.15s;
      line-height: 1;
    }

    .icon-btn:hover {
      color: #aaa;
    }

    .body-wrap {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .tab-nav {
      width: 42px;
      background: #161616;
      border-right: 1px solid #2a2a2a;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px 0;
      gap: 6px;
      flex-shrink: 0;
    }

    .tab-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 8px 4px;
      background: none;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      width: 36px;
      transition: background 0.15s;
    }

    .tab-btn:hover {
      background: #222;
    }

    .tab-btn.active {
      background: #2a1010;
    }

    .tab-icon {
      font-size: 1rem;
      color: #555;
      transition: color 0.15s;
    }

    .tab-btn.active .tab-icon {
      color: #ff4444;
    }

    .tab-label {
      font-size: 0.52rem;
      color: #444;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .tab-btn.active .tab-label {
      color: #ff4444;
    }

    .content-wrap {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .content-wrap::-webkit-scrollbar {
      width: 4px;
    }

    .content-wrap::-webkit-scrollbar-track {
      background: #111;
    }

    .content-wrap::-webkit-scrollbar-thumb {
      background: #2a2a2a;
      border-radius: 2px;
    }

    .tab-panel {
      display: none;
      padding: 14px 12px;
    }

    .tab-panel.active {
      display: block;
    }

    .keyword-title {
      font-size: 1.3rem;
      font-weight: 800;
      color: #f1f1f1;
      margin-bottom: 4px;
      line-height: 1.3;
    }

    .keyword-underline {
      width: 36px;
      height: 3px;
      background: #ff4444;
      border-radius: 2px;
      margin-bottom: 14px;
    }

    .section-block {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .section-icon-box {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    .icon-red {
      background: #3a0f0f;
      color: #ff6655;
    }

    .icon-blue {
      background: #0f1a2e;
      color: #6699ff;
    }

    .icon-yellow {
      background: #1f1800;
      color: #ffcc44;
    }

    .icon-gray {
      background: #1e1e1e;
      color: #888;
    }

    .section-title-text {
      font-size: 0.8rem;
      font-weight: 700;
      color: #ddd;
      line-height: 1.3;
    }

    .bullet-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .bullet-item {
      display: flex;
      gap: 7px;
      align-items: flex-start;
      font-size: 0.78rem;
      color: #ccc;
      line-height: 1.55;
    }

    .bullet-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      margin-top: 5px;
      flex-shrink: 0;
    }

    .dot-red {
      background: #ff4444;
    }

    .dot-blue {
      background: #6699ff;
    }

    .dot-yellow {
      background: #ffcc44;
    }

    .conclusion-box {
      background: #111;
      border-left: 3px solid #ff4444;
      border-radius: 0 8px 8px 0;
      padding: 10px 12px;
      margin-bottom: 10px;
      font-size: 0.78rem;
      color: #bbb;
      line-height: 1.65;
    }

    .source-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .source-title-text {
      font-size: 0.72rem;
      font-weight: 700;
      color: #666;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .view-all-btn {
      font-size: 0.68rem;
      color: #ff4444;
      background: none;
      border: none;
      cursor: pointer;
    }

    .video-card {
      background: #1a1a1a;
      border: 1px solid #252525;
      border-radius: 8px;
      margin-bottom: 8px;
      overflow: hidden;
      transition: border-color 0.15s;
    }

    .video-card:hover {
      border-color: #3a3a3a;
    }

    .video-card-inner {
      display: flex;
      gap: 10px;
      padding: 10px;
      align-items: flex-start;
    }

    .video-thumb {
      width: 76px;
      height: 48px;
      object-fit: cover;
      border-radius: 5px;
      flex-shrink: 0;
      background: #222;
    }

    .video-thumb-placeholder {
      width: 76px;
      height: 48px;
      border-radius: 5px;
      background: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #444;
      font-size: 1.2rem;
      flex-shrink: 0;
    }

    .video-info {
      flex: 1;
      min-width: 0;
    }

    .video-title-text {
      font-size: 0.78rem;
      font-weight: 600;
      color: #e0e0e0;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      overflow: hidden;
      text-overflow: ellipsis;
      word-break: break-all;
      margin-bottom: 5px;
      text-decoration: none;
    }

    .video-title-text:hover {
      color: #ff6655;
    }

    .video-subtitle {
      font-size: 0.7rem;
      color: #777;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 6px;
    }

    .video-meta-row {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      align-items: center;
    }

    .channel-badge {
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 3px;
      font-weight: 600;
      background: #222;
      color: #888;
      border: 1px solid #2a2a2a;
    }

    .badge {
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 3px;
      font-weight: 600;
    }

    .badge-ad {
      background: #2a1010;
      color: #ff5555;
      border: 1px solid #441111;
    }

    .badge-noad {
      background: #0f1f14;
      color: #44cc66;
      border: 1px solid #1a3a22;
    }

    .badge-cred {
      background: #111827;
      color: #6699ff;
      border: 1px solid #1e2d4a;
    }

    .loading-wrap {
      padding: 24px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .step-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      transition: all 0.3s;
    }

    .step-row.active {
      border-color: #ff4444;
      background: #1f1010;
    }

    .step-row.done {
      border-color: #44cc66;
      background: #0f1f14;
    }

    .step-icon-wrap {
      width: 20px;
      text-align: center;
    }

    .step-label-text {
      font-size: 0.8rem;
      color: #666;
    }

    .step-row.active .step-label-text {
      color: #ff4444;
    }

    .step-row.done .step-label-text {
      color: #44cc66;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .spinner {
      display: inline-block;
      width: 13px;
      height: 13px;
      border: 2px solid #333;
      border-top-color: #ff4444;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    .state-screen {
      padding: 40px 16px;
      text-align: center;
      color: #555;
      font-size: 0.85rem;
      line-height: 1.8;
    }

    .state-screen .icon {
      font-size: 2rem;
      display: block;
      margin-bottom: 10px;
    }

    .btn-primary {
      margin-top: 14px;
      padding: 9px 22px;
      background: #ff4444;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .btn-primary:hover {
      background: #cc2222;
    }

    .btn-retry {
      margin-top: 10px;
      padding: 7px 18px;
      background: #2a1010;
      color: #ff6655;
      border: 1px solid #441111;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .btn-retry:hover {
      background: #3a1515;
    }

    .error-msg {
      color: #ff6666;
      font-size: 0.82rem;
      line-height: 1.6;
    }

    .error-sub {
      color: #555;
      font-size: 0.75rem;
      margin-top: 4px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="header-left">
      <div class="logo">Tubify</div>
      <div class="logo-sub">The Intelligent Curator</div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="btn-refresh" title="새로고침">&#8635;</button>
    </div>
  </div>

  <div id="screen-login" class="state-screen hidden">
    <span class="icon">&#128274;</span>
    AI 분석을 보려면<br>로그인이 필요합니다.
    <br><button class="btn-primary" id="btn-login">Google 로그인</button>
  </div>

  <div id="screen-empty" class="state-screen hidden">
    <span class="icon">&#128269;</span>
    유튜브에서 검색하면<br>AI 분석이 시작됩니다.
  </div>

  <div id="screen-loading" class="hidden">
    <div class="loading-wrap">
      <div class="step-row" id="s1">
        <div class="step-icon-wrap" id="s1-icon">&#128269;</div><span class="step-label-text">영상 검색 중...</span>
      </div>
      <div class="step-row" id="s2">
        <div class="step-icon-wrap" id="s2-icon">&#128221;</div><span class="step-label-text">자막 분석 중...</span>
      </div>
      <div class="step-row" id="s3">
        <div class="step-icon-wrap" id="s3-icon">&#129302;</div><span class="step-label-text">AI 교차 분석 중...</span>
      </div>
    </div>
  </div>

  <div id="screen-error" class="state-screen hidden">
    <span class="icon">&#9888;&#65039;</span>
    <div class="error-msg" id="err-msg">분석 중 오류가 발생했습니다.</div>
    <div class="error-sub" id="err-sub"></div>
    <button class="btn-retry" id="btn-retry">다시 시도</button>
  </div>

  <div id="screen-results" class="body-wrap hidden">
    <div class="tab-nav">
      <button class="tab-btn active" data-tab="summary" title="요약">
        <span class="tab-icon">&#128203;</span>
        <span class="tab-label">SUMM</span>
      </button>
      <button class="tab-btn" data-tab="insights" title="인사이트">
        <span class="tab-icon">&#128161;</span>
        <span class="tab-label">INSIG</span>
      </button>
      <button class="tab-btn" data-tab="sources" title="소스">
        <span class="tab-icon">&#128279;</span>
        <span class="tab-label">SRC</span>
      </button>
    </div>
    <div class="content-wrap">
      <div id="tab-summary" class="tab-panel active">
        <div class="keyword-title" id="kw-title-s">-</div>
        <div class="keyword-underline"></div>
        <div id="summary-sections"></div>
      </div>
      <div id="tab-insights" class="tab-panel">
        <div class="keyword-title" id="kw-title-i">-</div>
        <div class="keyword-underline"></div>
        <div id="insights-sections"></div>
      </div>
      <div id="tab-sources" class="tab-panel">
        <div class="source-header">
          <span class="source-title-text">주요 소스 및 통찰</span>
          <button class="view-all-btn">VIEW ALL</button>
        </div>
        <div id="sources-list"></div>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="side_panel.js"></script>

</body>

</html>
