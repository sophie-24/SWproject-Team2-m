<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechVisibility — 대시보드</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", sans-serif;
      background: #0f0f0f;
      color: #f1f1f1;
      min-height: 100vh;
      padding: 24px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 720px;
      margin: 0 auto 32px;
    }

    .logo {
      font-size: 1.2rem;
      font-weight: 800;
      color: #ff4444;
    }

    .btn-logout {
      padding: 8px 16px;
      background: transparent;
      border: 1px solid #333;
      border-radius: 8px;
      color: #888;
      font-size: 0.82rem;
      cursor: pointer;
    }
    .btn-logout:hover { border-color: #666; color: #f1f1f1; }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    .section-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 16px;
    }

    /* 뉴스레터 카드 */
    .newsletter-card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 16px;
    }

    .newsletter-date {
      font-size: 0.78rem;
      color: #666;
      margin-bottom: 12px;
    }

    .newsletter-subject {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 16px;
      color: #f1f1f1;
    }

    .topic-item {
      border-top: 1px solid #2a2a2a;
      padding: 16px 0;
    }

    .topic-name {
      font-size: 0.95rem;
      font-weight: 700;
      color: #ff4444;
      margin-bottom: 8px;
    }

    .topic-summary {
      font-size: 0.85rem;
      color: #ccc;
      line-height: 1.7;
      margin-bottom: 10px;
    }

    .pros-cons {
      display: flex;
      gap: 16px;
      margin-bottom: 10px;
    }

    .pros, .cons {
      flex: 1;
      font-size: 0.8rem;
      line-height: 1.6;
    }

    .pros-title { color: #44cc44; font-weight: 700; margin-bottom: 4px; }
    .cons-title { color: #ff6644; font-weight: 700; margin-bottom: 4px; }
    .pros li, .cons li { color: #aaa; margin-left: 14px; }

    .sources {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .source-link {
      font-size: 0.78rem;
      color: #6699ff;
      text-decoration: none;
      background: #1e2a3a;
      border: 1px solid #2a3a5a;
      border-radius: 6px;
      padding: 3px 8px;
    }
    .source-link:hover { color: #99bbff; }

    /* 빈 상태 */
    .empty-state {
      text-align: center;
      padding: 64px 24px;
      color: #555;
    }
    .empty-state .icon { font-size: 3rem; margin-bottom: 16px; }
    .empty-state p { font-size: 0.9rem; line-height: 1.7; }

    .loading {
      text-align: center;
      padding: 48px;
      color: #666;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">✦ TechVisibility</span>
    <button class="btn-logout" onclick="logout()">로그아웃</button>
  </div>

  <div class="container">
    <div class="section-title">내 뉴스레터 히스토리</div>
    <div id="newsletter-list">
      <div class="loading">불러오는 중...</div>
    </div>
  </div>

  <script>
    const API = "http://127.0.0.1:8000";

    // 로그인 확인
    const token = localStorage.getItem("access_token");
    if (!token) {
      window.location.href = "/";
    }

    // ── 뉴스레터 히스토리 로드 ────────────────────────
    async function loadHistory() {
      const listEl = document.getElementById("newsletter-list");

      try {
        const res = await fetch(`${API}/newsletter/history`, {
          headers: { "Authorization": `Bearer ${token}` }
        });

        if (res.status === 401) {
          localStorage.removeItem("access_token");
          window.location.href = "/";
          return;
        }

        const data = await res.json();
        const newsletters = data.newsletters || [];

        if (!newsletters.length) {
          listEl.innerHTML = `
            <div class="empty-state">
              <div class="icon">📭</div>
              <p>
                아직 발송된 뉴스레터가 없습니다.<br>
                유튜브에서 관심 있는 주제를 검색해보세요.<br>
                <br>
                같은 주제를 2번 이상 검색하면<br>
                저녁 9시에 뉴스레터로 발송됩니다.
              </p>
            </div>
          `;
          return;
        }

        listEl.innerHTML = newsletters.map(renderCard).join("");

      } catch (err) {
        listEl.innerHTML = `
          <div class="empty-state">
            <div class="icon">⚠️</div>
            <p>불러오기 실패 — 백엔드 서버를 확인해주세요.</p>
          </div>
        `;
      }
    }

    // ── 카드 렌더 ─────────────────────────────────────
    function renderCard(newsletter) {
      const date = new Date(newsletter.delivered_at).toLocaleDateString("ko-KR", {
        year: "numeric", month: "long", day: "numeric",
        hour: "2-digit", minute: "2-digit"
      });

      const content = typeof newsletter.content_json === "string"
        ? JSON.parse(newsletter.content_json)
        : newsletter.content_json;

      const topicsHtml = (content.topics || []).map(topic => `
        <div class="topic-item">
          <div class="topic-name">📌 ${escapeHtml(topic.topic)}</div>
          <div class="topic-summary">
            ${(topic.summary || []).filter(Boolean).map(s => `• ${escapeHtml(s)}`).join("<br>")}
          </div>
          <div class="pros-cons">
            <div class="pros">
              <div class="pros-title">✅ 장점</div>
              <ul>${(topic.pros || []).map(p => `<li>${escapeHtml(p)}</li>`).join("")}</ul>
            </div>
            <div class="cons">
              <div class="cons-title">⚠️ 단점</div>
              <ul>${(topic.cons || []).map(c => `<li>${escapeHtml(c)}</li>`).join("")}</ul>
            </div>
          </div>
          <div class="sources">
            ${(topic.sources || []).map(s =>
              `<a href="${escapeHtml(s.url)}" target="_blank" class="source-link">
                🔗 ${escapeHtml(s.title)}
              </a>`
            ).join("")}
          </div>
        </div>
      `).join("");

      return `
        <div class="newsletter-card">
          <div class="newsletter-date">${date}</div>
          <div class="newsletter-subject">${escapeHtml(content.subject || "")}</div>
          ${topicsHtml}
        </div>
      `;
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function logout() {
      localStorage.removeItem("access_token");
      window.location.href = "/";
    }

    // 초기화
    loadHistory();
  </script>
</body>
</html>
