<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tubify — 분석 중</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;800&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Noto Sans KR", "Segoe UI", sans-serif;
      background: #f7f9fb;
      color: #191c1e;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      overflow: hidden;
    }

    /* 배경 장식 원 */
    .bg-blob {
      position: fixed;
      border-radius: 9999px;
      filter: blur(60px);
      pointer-events: none;
    }

    .bg-blob-red {
      background: rgba(255, 0, 0, 0.05);
      width: 38%;
      height: 500px;
      left: 10%;
      top: 50%;
      transform: translateY(-50%);
    }

    .bg-blob-blue {
      background: rgba(0, 89, 186, 0.05);
      width: 47%;
      height: 600px;
      left: 28%;
      top: 50%;
      transform: translateY(-50%);
    }

    /* 레이아웃 */
    .page-center {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 672px;
    }

    /* 브랜드 로고 */
    .brand {
      margin-bottom: 48px;
    }

    .brand-logo {
      font-size: 60px;
      font-weight: 800;
      color: red;
      letter-spacing: -0.05em;
      line-height: 1;
    }

    /* 카드 */
    .loading-card {
      position: relative;
      background: #fff;
      border: 1px solid rgba(235, 187, 180, 0.2);
      border-radius: 24px;
      box-shadow: 0 32px 64px rgba(25, 28, 30, 0.08);
      padding: 65px;
      width: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 48px;
    }

    /* 카드 좌측 빨간 액센트 바 */
    .loading-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 8px;
      background: rgba(255, 0, 0, 0.2);
    }

    /* 헤딩 영역 */
    .loading-message {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 100%;
    }

    .loading-heading {
      font-size: 28px;
      font-weight: 400;
      color: #191c1e;
      text-align: center;
      letter-spacing: -0.027em;
      line-height: 1.34;
    }

    .loading-subtext {
      font-size: 18px;
      font-weight: 400;
      color: #515f74;
      text-align: center;
      line-height: 1.625;
    }

    /* 진행률 영역 */
    .progress-section {
      display: flex;
      flex-direction: column;
      gap: 24px;
      width: 100%;
      max-width: 512px;
    }

    .progress-track {
      background: #e6e8ea;
      height: 12px;
      border-radius: 9999px;
      overflow: hidden;
      width: 100%;
    }

    .progress-fill {
      height: 100%;
      border-radius: 9999px;
      background: linear-gradient(90deg, #ff0000 0%, #ff5555 50%, #ff0000 100%);
      width: 0%;
      transition: width 0.4s ease;
    }

    .progress-labels {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px;
    }

    .progress-status {
      font-size: 14px;
      font-weight: 700;
      color: red;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .progress-percent {
      font-size: 14px;
      font-weight: 700;
      color: rgba(25, 28, 30, 0.4);
    }
  </style>
</head>

<body>
  <div class="bg-blob bg-blob-red"></div>
  <div class="bg-blob bg-blob-blue"></div>

  <div class="page-center">
    <div class="brand">
      <span class="brand-logo">Tubify</span>
    </div>

    <div class="loading-card">
      <div class="loading-message">
        <p class="loading-heading">최근 1개월간의 시청 기록을 분석 중입니다 ...</p>
        <p class="loading-subtext">
          당신에게 딱 맞는 요약을 준비하고 있어요.<br />
          잠시만 기다려 주세요.
        </p>
      </div>

      <div class="progress-section">
        <div class="progress-track">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="progress-labels">
          <span class="progress-status">PROCESSING</span>
          <span class="progress-percent" id="progress-percent">0%</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    let current = 0;

    // URL 파라미터로 리디렉션 경로 지정 가능 (기본: dashboard.html)
    const params = new URLSearchParams(location.search);
    const redirectTo = params.get("redirect") || "dashboard.html";

    function tick() {
      if (current >= 100) {
        document.getElementById("progress-fill").style.width = "100%";
        document.getElementById("progress-percent").textContent = "100%";
        setTimeout(() => { window.location.href = redirectTo; }, 500);
        return;
      }

      // 초반엔 빠르게, 후반엔 천천히
      const step = current < 70
        ? Math.random() * 4 + 2
        : Math.random() * 1.5 + 0.5;

      current = Math.min(current + step, 100);

      document.getElementById("progress-fill").style.width = current + "%";
      document.getElementById("progress-percent").textContent = Math.floor(current) + "%";

      const delay = current < 70 ? 150 : 300;
      setTimeout(tick, delay);
    }

    tick();
  </script>
</body>

</html>
