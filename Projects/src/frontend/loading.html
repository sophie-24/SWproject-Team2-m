<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tubify — 분석 중</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;800&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Noto Sans KR", "Segoe UI", sans-serif;
      background: #f7f9fb;
      color: #191c1e;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      overflow: hidden;
    }

    /* 배경 장식 원 */
    .bg-blob {
      position: fixed;
      border-radius: 9999px;
      filter: blur(60px);
      pointer-events: none;
    }

    .bg-blob-red {
      background: rgba(255, 0, 0, 0.05);
      width: 38%;
      height: 500px;
      left: 10%;
      top: 50%;
      transform: translateY(-50%);
    }

    .bg-blob-blue {
      background: rgba(0, 89, 186, 0.05);
      width: 47%;
      height: 600px;
      left: 28%;
      top: 50%;
      transform: translateY(-50%);
    }

    /* 레이아웃 */
    .page-center {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 672px;
    }

    /* 브랜드 로고 */
    .brand {
      margin-bottom: 48px;
    }

    .brand-logo {
      font-size: 60px;
      font-weight: 800;
      color: red;
      letter-spacing: -0.05em;
      line-height: 1;
    }

    /* 카드 */
    .loading-card {
      position: relative;
      background: #fff;
      border: 1px solid rgba(235, 187, 180, 0.2);
      border-radius: 24px;
      box-shadow: 0 32px 64px rgba(25, 28, 30, 0.08);
      padding: 65px;
      width: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 48px;
    }

    /* 카드 좌측 빨간 액센트 바 */
    .loading-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 8px;
      background: rgba(255, 0, 0, 0.2);
    }

    /* 헤딩 영역 */
    .loading-message {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 100%;
    }

    .loading-heading {
      font-size: 28px;
      font-weight: 400;
      color: #191c1e;
      text-align: center;
      letter-spacing: -0.027em;
      line-height: 1.34;
    }

    .loading-subtext {
      font-size: 18px;
      font-weight: 400;
      color: #515f74;
      text-align: center;
      line-height: 1.625;
    }

    /* 진행률 영역 */
    .progress-section {
      display: flex;
      flex-direction: column;
      gap: 24px;
      width: 100%;
      max-width: 512px;
    }

    .progress-track {
      background: #e6e8ea;
      height: 12px;
      border-radius: 9999px;
      overflow: hidden;
      width: 100%;
    }

    .progress-fill {
      height: 100%;
      border-radius: 9999px;
      background: linear-gradient(90deg, #ff0000 0%, #ff5555 50%, #ff0000 100%);
      width: 0%;
      transition: width 0.4s ease;
    }

    .progress-labels {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px;
    }

    .progress-status {
      font-size: 14px;
      font-weight: 700;
      color: red;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .progress-percent {
      font-size: 14px;
      font-weight: 700;
      color: rgba(25, 28, 30, 0.4);
    }
  </style>
</head>

<body>
  <div class="bg-blob bg-blob-red"></div>
  <div class="bg-blob bg-blob-blue"></div>

  <div class="page-center">
    <div class="brand">
      <span class="brand-logo">Tubify</span>
    </div>

    <div class="loading-card">
      <div class="loading-message">
        <p class="loading-heading">최근 1개월간의 시청 기록을 분석 중입니다 ...</p>
        <p class="loading-subtext">
          당신에게 딱 맞는 요약을 준비하고 있어요.<br />
          잠시만 기다려 주세요.
        </p>
      </div>

      <div class="progress-section">
        <div class="progress-track">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="progress-labels">
          <span class="progress-status" id="progress-status">PROCESSING</span>
          <span class="progress-percent" id="progress-percent">0%</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const EXTENSION_IDS = __EXTENSION_ID__;
    const params = new URLSearchParams(location.search);

    // 토큰 저장
    const urlToken = params.get("token");
    if (urlToken) {
      localStorage.setItem("access_token", urlToken);
      sessionStorage.setItem("loggedIn", "1");
      if (typeof chrome !== "undefined" && chrome.runtime) {
        EXTENSION_IDS.forEach(id => {
          try { chrome.runtime.sendMessage(id, { type: "SET_TOKEN", token: urlToken }, () => {}); } catch (_) {}
        });
      }
      history.replaceState({}, "", location.pathname);
    }

    const jwt = localStorage.getItem("access_token");
    if (!jwt) { window.location.href = "/"; }

    let current = 0;

    function setProgress(pct, statusText) {
      current = pct;
      document.getElementById("progress-fill").style.width = pct + "%";
      document.getElementById("progress-percent").textContent = Math.floor(pct) + "%";
      if (statusText) document.getElementById("progress-status").textContent = statusText;
    }

    function animateTo(targetPct, statusText, duration) {
      return new Promise(resolve => {
        const start = current;
        const startTime = Date.now();
        function step() {
          const elapsed = Date.now() - startTime;
          const t = Math.min(elapsed / duration, 1);
          setProgress(start + (targetPct - start) * t, statusText);
          if (t < 1) requestAnimationFrame(step);
          else resolve();
        }
        requestAnimationFrame(step);
      });
    }

    function goNext() {
      setProgress(100, "COMPLETE");
      setTimeout(() => { window.location.href = "/home.html"; }, 600);
    }

    async function run() {
      await animateTo(15, "COLLECTING", 500);

      const canUseExt = typeof chrome !== "undefined" && chrome.runtime && EXTENSION_IDS.length > 0;

      let keywords = [];

      // TODO: [Issue #38] GET_HISTORY + /profile/analyze-history 블록 제거 필요
      // history 권한 제거로 GET_HISTORY는 항상 빈 응답 → keywords는 항상 [] → 아래 fetch 블록 미실행
      // tryGetHistory(), for 루프, keywords 관련 fetch 블록 전체 삭제할 것
      if (canUseExt) {
        const tryGetHistory = (id) => new Promise(resolve => {
          const t = setTimeout(() => resolve(null), 3000);
          try {
            chrome.runtime.sendMessage(id, { type: "GET_HISTORY" }, res => {
              clearTimeout(t);
              resolve(chrome.runtime.lastError ? null : (res || null));
            });
          } catch (_) { clearTimeout(t); resolve(null); }
        });

        for (const id of EXTENSION_IDS) {
          const result = await tryGetHistory(id);
          if (result && result.keywords?.length > 0) {
            keywords = result.keywords;
            break;
          }
        }
      }

      await animateTo(45, "ANALYZING", 800);

      if (keywords.length > 0) {
        try {
          const res = await fetch("/profile/analyze-history", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": `Bearer ${jwt}` },
            body: JSON.stringify({ keywords: keywords.slice(0, 100) }),
          });
          if (res.ok) {
            const data = await res.json();
            // 분석된 카테고리를 localStorage에 저장 → home.html에서 읽어서 pill 자동 선택
            if (data.categories?.length > 0) {
              localStorage.setItem("detectedCategories", JSON.stringify(data.categories));
            }
            if (data.intent_type) {
              localStorage.setItem("detectedIntent", data.intent_type);
            }
            await animateTo(90, "ANALYZING", 1200);
          }
        } catch (_) {}
      }

      await animateTo(98, "DONE", 400);
      goNext();
    }

    run();
  </script>
</body>

</html>
