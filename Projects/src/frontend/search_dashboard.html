<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TechVisibility — 검색 분석</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f0f0f;
      color: #f1f1f1;
      min-height: 100vh;
      padding: 32px 24px;
    }

    .wrap { max-width: 800px; margin: 0 auto; }

    /* 헤더 */
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }
    .logo { font-size: 1.1rem; font-weight: 800; color: #ff4444; text-decoration: none; }
    .divider { color: #333; }
    .keyword-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: #f1f1f1;
      word-break: break-all;
    }

    /* 로딩 */
    #loading {
      text-align: center;
      padding: 80px 0;
    }
    .spinner-wrap { margin-bottom: 20px; }
    .spinner {
      display: inline-block;
      width: 36px; height: 36px;
      border: 3px solid #2a2a2a;
      border-top-color: #ff4444;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-steps { display: flex; flex-direction: column; gap: 8px; align-items: center; }
    .step {
      font-size: 0.85rem;
      color: #444;
      transition: color 0.3s;
    }
    .step.active { color: #f1f1f1; }
    .step.done   { color: #44cc44; }

    /* 에러 */
    #error {
      display: none;
      background: #1a1111;
      border: 1px solid #4a2a2a;
      border-radius: 12px;
      padding: 28px;
      text-align: center;
    }
    #error p { color: #cc6666; margin-bottom: 12px; }
    #error a  { color: #ff4444; }

    /* 결과 */
    #result { display: none; }

    /* 상단 메타 */
    .meta-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .meta-chip {
      font-size: 0.78rem;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 20px;
      padding: 4px 12px;
      color: #888;
    }

    /* 공통 사실 / 쟁점 */
    .insight-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 28px;
    }
    @media (max-width: 600px) { .insight-grid { grid-template-columns: 1fr; } }
    .insight-box {
      background: #141414;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 16px;
    }
    .insight-box h3 {
      font-size: 0.72rem;
      font-weight: 700;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 10px;
    }
    .insight-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
    .insight-list li {
      font-size: 0.82rem;
      color: #bbb;
      line-height: 1.5;
      padding-left: 10px;
      border-left: 2px solid #2a2a2a;
    }
    .insight-list.controversy li { border-left-color: #ff6633; color: #ffaa88; }

    /* 영상 카드 */
    .section-title {
      font-size: 0.72rem;
      font-weight: 700;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 14px;
    }
    .video-list { display: flex; flex-direction: column; gap: 12px; }

    .video-card {
      display: flex;
      gap: 14px;
      background: #141414;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 14px;
      text-decoration: none;
      transition: border-color 0.2s;
      align-items: flex-start;
    }
    .video-card:hover { border-color: #ff4444; }

    .rank {
      font-size: 1.2rem;
      font-weight: 800;
      color: #ff4444;
      min-width: 24px;
      line-height: 1;
      padding-top: 2px;
    }

    .thumb {
      width: 100px;
      min-width: 100px;
      aspect-ratio: 16/9;
      object-fit: cover;
      border-radius: 6px;
      background: #1a1a1a;
    }

    .video-info { flex: 1; overflow: hidden; }

    .video-title {
      font-size: 0.92rem;
      font-weight: 600;
      color: #f1f1f1;
      margin-bottom: 5px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 7px; }
    .badge {
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 4px;
    }
    .badge.ad         { background: #2a1111; color: #cc5555; border: 1px solid #4a2222; }
    .badge.subscribed { background: #112211; color: #55aa55; border: 1px solid #224422; }
    .badge.credibility-high { background: #111a22; color: #5599cc; border: 1px solid #223344; }
    .badge.credibility-low  { background: #221a11; color: #cc9955; border: 1px solid #443322; }

    .video-summary {
      font-size: 0.8rem;
      color: #888;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .no-transcript { font-size: 0.78rem; color: #444; font-style: italic; }

    /* 재검색 */
    .footer-row {
      margin-top: 32px;
      text-align: center;
    }
    .footer-row a {
      color: #ff4444;
      font-size: 0.85rem;
      text-decoration: none;
    }
    .footer-row a:hover { text-decoration: underline; }
  </style>
</head>
<body>
<div class="wrap">

  <!-- 헤더 -->
  <div class="header">
    <a class="logo" href="/">✦ TechVisibility</a>
    <span class="divider">/</span>
    <span class="keyword-title" id="keyword-display">검색어 로딩 중...</span>
  </div>

  <!-- 로딩 -->
  <div id="loading">
    <div class="spinner-wrap"><div class="spinner"></div></div>
    <div class="loading-steps">
      <span class="step active" id="step-1">📡 유튜브에서 영상 수집 중...</span>
      <span class="step" id="step-2">🤖 AI 자막 분석 중...</span>
      <span class="step" id="step-3">✨ 결과 정리 중...</span>
    </div>
  </div>

  <!-- 에러 -->
  <div id="error">
    <p id="error-msg">분석 중 오류가 발생했습니다.</p>
    <a href="javascript:location.reload()">다시 시도</a>
  </div>

  <!-- 결과 -->
  <div id="result">
    <div class="meta-row">
      <span class="meta-chip" id="video-count-chip"></span>
      <span class="meta-chip" id="fact-count-chip"></span>
    </div>

    <div class="insight-grid">
      <div class="insight-box">
        <h3>📌 공통 사실</h3>
        <ul class="insight-list" id="common-facts"></ul>
      </div>
      <div class="insight-box">
        <h3>⚡ 쟁점</h3>
        <ul class="insight-list controversy" id="controversies"></ul>
      </div>
    </div>

    <p class="section-title">추천 영상</p>
    <div class="video-list" id="video-list"></div>

    <div class="footer-row">
      <a href="javascript:history.back()">← 유튜브로 돌아가기</a>
    </div>
  </div>

</div>

<script>
  const API = "";  // 같은 서버에서 서빙
  const params = new URLSearchParams(location.search);
  const keyword = params.get("keyword") || "";
  const token   = params.get("token") || "";

  // 키워드 없으면 에러
  if (!keyword) {
    showError("검색어가 없습니다. 유튜브에서 검색 후 익스텐션 버튼을 눌러주세요.");
  } else if (!token) {
    showError('로그인이 필요합니다. <a href="/auth/login">Google 로그인</a>');
  } else {
    document.getElementById("keyword-display").textContent = `"${keyword}"`;
    document.title = `${keyword} — TechVisibility`;
    runAnalysis();
  }

  // ── 분석 실행 ──────────────────────────────────────────────────────────────

  async function runAnalysis() {
    // 로딩 스텝 애니메이션
    const steps = ["step-1", "step-2", "step-3"];
    let stepIdx = 0;
    const stepTimer = setInterval(() => {
      if (stepIdx > 0) document.getElementById(steps[stepIdx - 1]).className = "step done";
      if (stepIdx < steps.length) {
        document.getElementById(steps[stepIdx]).className = "step active";
        stepIdx++;
      }
    }, 4000);

    try {
      const res = await fetch(
        `${API}/analyze_search?keyword=${encodeURIComponent(keyword)}`,
        { headers: { "Authorization": `Bearer ${token}` } }
      );

      clearInterval(stepTimer);
      steps.forEach(id => document.getElementById(id).className = "step done");

      if (res.status === 401) {
        showError('토큰이 만료됐습니다. <a href="/auth/login">다시 로그인</a>해주세요.');
        return;
      }
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        showError(`분석 실패 (${res.status}): ${data.detail || "서버 오류"}`);
        return;
      }

      const data = await res.json();
      renderResult(data);
    } catch (e) {
      clearInterval(stepTimer);
      showError(`서버 연결 실패 — 백엔드(localhost:8000)를 확인해주세요.`);
    }
  }

  // ── 결과 렌더링 ────────────────────────────────────────────────────────────

  function renderResult(data) {
    document.getElementById("loading").style.display = "none";
    document.getElementById("result").style.display = "block";

    const videos = data.videos || [];
    const facts   = data.common_facts || [];
    const controversies = data.controversies || [];

    document.getElementById("video-count-chip").textContent  = `영상 ${videos.length}개 분석`;
    document.getElementById("fact-count-chip").textContent   = `공통 사실 ${facts.length}개`;

    // 공통 사실
    const factEl = document.getElementById("common-facts");
    factEl.innerHTML = facts.length
      ? facts.map(f => `<li>${esc(f)}</li>`).join("")
      : `<li style="color:#444;font-style:italic;">없음</li>`;

    // 쟁점
    const conEl = document.getElementById("controversies");
    conEl.innerHTML = controversies.length
      ? controversies.map(c => `<li>${esc(c)}</li>`).join("")
      : `<li style="color:#444;font-style:italic;">없음</li>`;

    // 영상 카드
    const listEl = document.getElementById("video-list");
    if (!videos.length) {
      listEl.innerHTML = `<p style="color:#444;text-align:center;padding:24px 0;">분석 가능한 영상이 없습니다.</p>`;
      return;
    }
    listEl.innerHTML = videos.map((v, i) => renderCard(v, i + 1)).join("");
  }

  function renderCard(v, rank) {
    const url  = `https://www.youtube.com/watch?v=${esc(v.video_id)}`;
    const thumb = `https://img.youtube.com/vi/${esc(v.video_id)}/mqdefault.jpg`;

    const adBadge = v.ad_detected
      ? `<span class="badge ad">광고포함</span>` : "";
    const subBadge = v.is_subscribed
      ? `<span class="badge subscribed">구독중</span>` : "";

    const cred = v.credibility_score ?? 0.5;
    const credBadge = cred >= 0.6
      ? `<span class="badge credibility-high">신뢰도 ${Math.round(cred * 100)}%</span>`
      : `<span class="badge credibility-low">신뢰도 ${Math.round(cred * 100)}%</span>`;

    const summary = v.transcript_available
      ? `<p class="video-summary">${esc(v.summary || "")}</p>`
      : `<p class="no-transcript">자막 없음</p>`;

    return `
      <a class="video-card" href="${url}" target="_blank">
        <span class="rank">${rank}</span>
        <img class="thumb" src="${thumb}" alt="" loading="lazy">
        <div class="video-info">
          <p class="video-title">${esc(v.title || "")}</p>
          <div class="badges">${adBadge}${subBadge}${credBadge}</div>
          ${summary}
        </div>
      </a>`;
  }

  // ── 유틸 ──────────────────────────────────────────────────────────────────

  function showError(html) {
    document.getElementById("loading").style.display = "none";
    const el = document.getElementById("error");
    el.style.display = "block";
    document.getElementById("error-msg").innerHTML = html;
  }

  function esc(str) {
    return String(str ?? "")
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
</script>
</body>
</html>
