<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tubify</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", sans-serif;
      background: #0f0f0f;
      color: #f1f1f1;
      min-height: 100vh;
    }

    /* ── 로그인 ── */
    #login-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 24px;
    }

    #login-screen h1 {
      font-size: 2rem;
      font-weight: 700;
    }

    #login-screen p {
      color: #aaa;
    }

    .google-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #fff;
      color: #333;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    .google-btn:hover {
      box-shadow: 0 4px 16px rgba(255, 255, 255, 0.2);
    }

    .google-btn img {
      width: 20px;
    }

    /* ── 메인 ── */
    #main-screen {
      display: none;
      padding: 32px;
      max-width: 860px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
    }

    header h1 {
      font-size: 1.4rem;
    }

    .logout-btn {
      background: transparent;
      border: 1px solid #444;
      color: #aaa;
      padding: 7px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .logout-btn:hover {
      border-color: #f1f1f1;
      color: #f1f1f1;
    }

    /* ── 검색바 ── */
    .search-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 28px;
    }

    .search-bar input {
      flex: 1;
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 12px 16px;
      color: #f1f1f1;
      font-size: 1rem;
      outline: none;
    }

    .search-bar input:focus {
      border-color: #ff0000;
    }

    .search-bar button {
      background: #ff0000;
      border: none;
      border-radius: 8px;
      color: #fff;
      padding: 12px 22px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: 600;
    }

    .search-bar button:hover {
      background: #cc0000;
    }

    /* ── 영상 카드 ── */
    .video-item {
      background: #1a1a1a;
      border-radius: 10px;
      margin-bottom: 12px;
      overflow: hidden;
    }

    .video-header {
      display: flex;
      gap: 14px;
      padding: 14px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .video-header:hover {
      background: #222;
    }

    .video-header img {
      width: 160px;
      min-width: 160px;
      aspect-ratio: 16/9;
      object-fit: cover;
      border-radius: 6px;
      background: #333;
    }

    .video-info {
      flex: 1;
      overflow: hidden;
    }

    .video-info h3 {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 6px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      line-clamp: 2;
      overflow: hidden;
    }

    .video-info .meta {
      font-size: 0.8rem;
      color: #888;
      margin-bottom: 8px;
    }

    .toggle-hint {
      font-size: 0.8rem;
      color: #ff6666;
    }

    /* ── 자막 영역 ── */
    .transcript-area {
      display: none;
      border-top: 1px solid #2a2a2a;
      padding: 16px;
      max-height: 360px;
      overflow-y: auto;
    }

    .transcript-area.open {
      display: block;
    }

    .transcript-entry {
      display: flex;
      gap: 12px;
      padding: 6px 0;
      border-bottom: 1px solid #1f1f1f;
      font-size: 0.87rem;
    }

    .transcript-entry:last-child {
      border-bottom: none;
    }

    .ts {
      color: #ff6666;
      white-space: nowrap;
      font-weight: 600;
      min-width: 48px;
    }

    .txt {
      color: #ccc;
      line-height: 1.5;
    }

    /* ── 상태 ── */
    .loading {
      text-align: center;
      color: #aaa;
      padding: 32px;
    }

    .empty {
      text-align: center;
      color: #555;
      padding: 32px;
    }

    .status-msg {
      font-size: 0.8rem;
      color: #888;
      padding: 8px 0 12px;
    }
  </style>
</head>

<body>
  <div id="login-screen">
    <h1>Tubify</h1>
    <p>유튜브 트렌드를 한눈에</p>
    <button class="google-btn" onclick="login()">
      <img src="https://www.google.com/favicon.ico" alt="" />
      Google 계정으로 로그인
    </button>
  </div>

  <div id="main-screen">
    <header>
      <h1>Tubify</h1>
      <button class="logout-btn" onclick="logout()">로그아웃</button>
    </header>

    <div class="search-bar">
      <input id="search-input" type="text" placeholder="키워드 입력 (예: 파이썬, AI, 클라우드)" />
      <button onclick="doSearch()">검색</button>
    </div>

    <div id="results"></div>
  </div>

  <script>
    const API = "";
    const EXTENSION_ID = "__EXTENSION_ID__";

    window.onload = () => {
      const params = new URLSearchParams(location.search);
      const token = params.get("token");

      if (token) {
        // JWT 저장
        localStorage.setItem("access_token", token);
        sessionStorage.setItem("loggedIn", "1");
        // 익스텐션에 토큰 전달 (설치된 경우에만)
        if (typeof chrome !== "undefined" && chrome.runtime) {
          chrome.runtime.sendMessage(
            EXTENSION_ID,
            { type: "SET_TOKEN", token: token },
            () => { if (chrome.runtime.lastError) {} }
          );
        }
        history.replaceState({}, "", location.pathname);
        // 익스텐션 팝업이 window.open()으로 이 페이지를 열었다면 → 창 자동 닫기
        // 사용자가 직접 웹사이트를 방문한 경우엔 window.opener === null 이므로 닫히지 않음
        if (window.opener !== null) {
          setTimeout(() => window.close(), 400);
          return;
        }
      }

      if (params.get("loggedIn") === "1") {
        sessionStorage.setItem("loggedIn", "1");
        history.replaceState({}, "", location.pathname);
      }
      if (sessionStorage.getItem("loggedIn")) showMain();
    };

    function login() {
      window.location.href = `${API}/auth/login`;
    }
    function logout() {
      sessionStorage.removeItem("loggedIn");
      document.getElementById("login-screen").style.display = "flex";
      document.getElementById("main-screen").style.display = "none";
    }
    function showMain() {
      document.getElementById("login-screen").style.display = "none";
      document.getElementById("main-screen").style.display = "block";
    }

    document.addEventListener("DOMContentLoaded", () => {
      document
        .getElementById("search-input")
        .addEventListener("keydown", (e) => {
          if (e.key === "Enter") doSearch();
        });
    });

    // ── 검색 ──────────────────────────────────────────
    async function doSearch() {
      const keyword = document.getElementById("search-input").value.trim();
      if (!keyword) return;

      const el = document.getElementById("results");
      el.innerHTML = '<div class="loading">검색 중...</div>';

      try {
        const res = await fetch(
          `${API}/search?keyword=${encodeURIComponent(keyword)}&max_results=5`,
        );
        const data = await res.json();

        if (!data.videos?.length) {
          el.innerHTML = '<div class="empty">검색 결과가 없습니다.</div>';
          return;
        }

        el.innerHTML = `
        <p class="status-msg">상위 ${data.videos.length}개 · 영상 클릭하면 자막 펼쳐짐</p>
        ${data.videos.map(videoItem).join("")}
      `;
      } catch {
        el.innerHTML =
          '<div class="empty">오류 발생. 서버가 실행 중인지 확인하세요.</div>';
      }
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    // ── 영상 카드 렌더 ──────────────────────────────
    function videoItem(v) {
      const views = v.view_count
        ? `조회수 ${Number(v.view_count).toLocaleString()} · `
        : "";
      return `
            <div class="video-item">
              <div class="video-header" onclick="toggleTranscript('${v.video_id}', this)">
                <img src="${v.thumbnail}" alt="" loading="lazy" />
                <div class="video-info">
                  <h3>${escapeHtml(v.title)}</h3>

                  <button onclick="runOrchestrator('${v.video_id}', event)"
                      style="background:#007bff; border:none; color:white; padding:4px 8px; border-radius:4px; font-size:0.8rem; cursor:pointer; margin-top:5px; margin-bottom:5px;">
                  AI 쟁점 분석
                  </button>

                  <div class="meta">${escapeHtml(v.channel_title)} · ${views}${escapeHtml(v.duration)}</div>
                  <span class="toggle-hint" id="hint-${v.video_id}">▼ 자막 보기</span>
                </div>
              </div>
              <div class="transcript-area" id="transcript-${v.video_id}">
                <div class="loading">자막 불러오는 중...</div>
              </div>
            </div>`;
    }

    // ── 자막 토글 ──────────────────────────────────
    const loaded = {};

    async function toggleTranscript(videoId, headerEl) {
      const area = document.getElementById(`transcript-${videoId}`);
      const hint = document.getElementById(`hint-${videoId}`);
      const isOpen = area.classList.contains("open");

      if (isOpen) {
        area.classList.remove("open");
        hint.textContent = "▼ 자막 보기";
        return;
      }

      area.classList.add("open");
      hint.textContent = "▲ 닫기";

      if (loaded[videoId]) return; // 이미 로드됨
      loaded[videoId] = true;

      try {
        const res = await fetch(`${API}/transcript/${videoId}`, { redirect: 'error' });
        if (!res.ok) {
          area.innerHTML = '<div class="empty">자막 없음</div>';
          return;
        }
        const data = await res.json();
        if (!data.transcript) {
          area.innerHTML = '<div class="empty">자막 없음</div>';
          return;
        }
        const entries = data.transcript.slice(0, 150);

        area.innerHTML = `
        <p class="status-msg">총 ${data.count}개 항목 (앞 150개 표시)</p>
        ${entries.map(t => `
          <div class="transcript-entry">
            <span class="ts">${formatTime(t.start)}</span>
            <span class="txt">${escapeHtml(t.text)}</span>
          </div>`).join("")}
      `;
      } catch {
        area.innerHTML = '<div class="empty">자막 없음</div>';
      }
    }

    // ── AI 오케스트레이터 실행 함수 ──────────────────────
    async function runOrchestrator(videoId, event) {
      event.stopPropagation(); // 1. 카드 클릭 시 자막 창이 같이 열리는 것을 방지합니다.

      const area = document.getElementById(`transcript-${videoId}`);
      const hint = document.getElementById(`hint-${videoId}`);

      // UI 상태 업데이트
      area.classList.add("open");
      hint.textContent = "▲ 분석 중";
      area.innerHTML = '<div class="loading">AI 오케스트레이터 가동 중... (광고 탐지 및 RAG 분석)</div>';

      try {
        // 2. 검색창의 키워드를 쿼리로 함께 보냅니다.
        const query = document.getElementById("search-input").value;
        const jwt = localStorage.getItem("access_token") || "";
        const res = await fetch(`${API}/ai_analyze/${videoId}?query=${encodeURIComponent(query)}`, {
          headers: { "Authorization": `Bearer ${jwt}` }
        });

        if (!res.ok) throw new Error();

        const data = await res.json();
        area.innerHTML = `
      <div style="background:#2a2a2a; padding:15px; border-radius:8px; border-left:4px solid #007bff; margin-bottom:10px;">
          <h4 style="color:#007bff; margin-bottom:10px;">🤖 AI 분석 리포트</h4>
          <p style="font-size:0.85rem; color:#aaa;">⚠️ 광고 의심 점수: <span style="color:#ff6666;">${data.ad_score}점</span></p>
          <hr style="border-color:#444; margin:10px 0;">
          <p style="font-size:0.85rem; color:#ccc; white-space:pre-wrap;">${data.summary || "요약 없음"}</p>
      </div>`;
      } catch {
        area.innerHTML = '<div class="empty">AI 분석 실패. 다시 시도해주세요.</div>';
      }
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
    }
  </script>
</body>
</html>
