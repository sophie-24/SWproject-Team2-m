<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TechVisibility Admin</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f0f0f;
      color: #e8e8e8;
      min-height: 100vh;
      padding: 32px 24px;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #ff4444;
      margin-bottom: 4px;
    }
    .subtitle { font-size: 0.85rem; color: #666; margin-bottom: 28px; }

    /* 인증 */
    #auth-section {
      max-width: 400px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 32px;
    }
    #auth-section h2 { font-size: 0.95rem; margin-bottom: 12px; color: #ccc; }
    .input-row { display: flex; gap: 8px; }
    input[type="password"], input[type="text"] {
      flex: 1;
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      color: #e8e8e8;
      padding: 8px 12px;
      font-size: 0.9rem;
      outline: none;
    }
    input:focus { border-color: #ff4444; }
    button {
      background: #ff4444;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    button:hover { background: #cc3333; }
    button:disabled { background: #444; cursor: not-allowed; }
    .btn-secondary {
      background: #2a2a2a;
      border: 1px solid #444;
    }
    .btn-secondary:hover { background: #333; }

    /* 상태 메시지 */
    .msg {
      font-size: 0.8rem;
      margin-top: 8px;
      padding: 6px 10px;
      border-radius: 6px;
    }
    .msg.ok  { background: #1a2a1a; color: #66cc66; border: 1px solid #2a4a2a; }
    .msg.err { background: #2a1a1a; color: #cc6666; border: 1px solid #4a2a2a; }

    /* 대시보드 패널 */
    #dashboard { display: none; }

    .panel-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    @media (max-width: 900px) { .panel-grid { grid-template-columns: 1fr; } }

    .panel {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      overflow: hidden;
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      border-bottom: 1px solid #2a2a2a;
      background: #141414;
    }
    .panel-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .badge {
      background: #2a2a2a;
      color: #888;
      border-radius: 20px;
      padding: 2px 10px;
      font-size: 0.75rem;
    }
    .panel-body { padding: 16px 18px; }

    /* 테이블 */
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }
    .data-table th {
      text-align: left;
      color: #666;
      font-weight: 600;
      padding: 6px 8px 10px;
      border-bottom: 1px solid #2a2a2a;
    }
    .data-table td {
      padding: 8px 8px;
      border-bottom: 1px solid #1e1e1e;
      color: #ccc;
      vertical-align: top;
    }
    .data-table tr:last-child td { border-bottom: none; }
    .data-table tr:hover td { background: #1e1e1e; }

    .tag {
      display: inline-block;
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 4px;
    }
    .tag.email  { background: #1a1a2a; color: #6699ff; border: 1px solid #2a2a4a; }
    .tag.search { background: #1a2a1a; color: #66cc88; border: 1px solid #2a4a2a; }
    .tag.watch  { background: #2a1a2a; color: #cc66cc; border: 1px solid #4a2a4a; }

    /* 파이프라인 실행 */
    .pipeline-panel { grid-column: 1 / -1; }
    .pipeline-row { display: flex; gap: 8px; align-items: center; }
    .pipeline-result {
      margin-top: 14px;
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 12px;
      font-size: 0.78rem;
      color: #888;
      max-height: 200px;
      overflow-y: auto;
      display: none;
      white-space: pre-wrap;
      word-break: break-all;
    }

    /* 빈 상태 */
    .empty { text-align: center; color: #444; padding: 24px 0; font-size: 0.85rem; }

    .spinner {
      display: inline-block;
      width: 12px; height: 12px;
      border: 2px solid #444;
      border-top-color: #ff4444;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-right: 6px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<h1>TechVisibility Admin</h1>
<p class="subtitle">관리자 전용 대시보드 — ADMIN_SECRET 인증 필요</p>

<!-- 인증 -->
<section id="auth-section">
  <h2>🔐 관리자 인증</h2>
  <div class="input-row">
    <input type="password" id="secret-input" placeholder="ADMIN_SECRET 입력" />
    <button id="auth-btn" onclick="authenticate()">인증</button>
  </div>
  <div id="auth-msg"></div>
</section>

<!-- 대시보드 -->
<div id="dashboard">
  <div class="panel-grid">

    <!-- 유저 목록 -->
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">👤 전체 유저</span>
        <span class="badge" id="user-count">—</span>
      </div>
      <div class="panel-body">
        <table class="data-table">
          <thead>
            <tr>
              <th>이메일</th>
              <th>수신 방법</th>
              <th>가입일</th>
            </tr>
          </thead>
          <tbody id="user-tbody">
            <tr><td colspan="3" class="empty">로딩 중...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- 오늘 행동 로그 -->
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">📋 오늘 행동 로그</span>
        <div style="display:flex;gap:8px;align-items:center;">
          <span class="badge" id="log-count">—</span>
          <button class="btn-secondary" style="padding:4px 10px;font-size:0.75rem;" onclick="loadLogs()">새로고침</button>
        </div>
      </div>
      <div class="panel-body">
        <table class="data-table">
          <thead>
            <tr>
              <th>유저</th>
              <th>타입</th>
              <th>키워드</th>
              <th>시간</th>
            </tr>
          </thead>
          <tbody id="log-tbody">
            <tr><td colspan="4" class="empty">로딩 중...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- 파이프라인 즉시 실행 -->
    <div class="panel pipeline-panel">
      <div class="panel-header">
        <span class="panel-title">⚡ 파이프라인 즉시 실행</span>
      </div>
      <div class="panel-body">
        <p style="font-size:0.82rem;color:#666;margin-bottom:12px;">특정 유저의 오늘 로그로 파이프라인을 즉시 실행합니다 (google_id 기준).</p>
        <div class="pipeline-row">
          <input type="text" id="pipeline-user-id" placeholder="google_id 입력 (유저 테이블에서 확인)" />
          <button id="run-btn" onclick="runPipeline()">실행</button>
        </div>
        <div id="pipeline-msg"></div>
        <pre class="pipeline-result" id="pipeline-result"></pre>
      </div>
    </div>

  </div>
</div>

<script>
  const API = "";  // 같은 서버에서 서빙
  let adminToken = "";

  // ── 인증 ──────────────────────────────────────────────────────────────────

  async function authenticate() {
    const secret = document.getElementById("secret-input").value.trim();
    if (!secret) return;

    adminToken = secret;
    document.getElementById("auth-btn").disabled = true;

    try {
      const res = await apiFetch("/admin/users");
      if (res.ok) {
        showMsg("auth-msg", "인증 성공 ✓", "ok");
        document.getElementById("auth-section").style.opacity = "0.5";
        document.getElementById("dashboard").style.display = "block";
        renderUsers(await res.json());
        loadLogs();
      } else {
        showMsg("auth-msg", "인증 실패 — ADMIN_SECRET 확인", "err");
        adminToken = "";
      }
    } catch (e) {
      showMsg("auth-msg", `서버 연결 실패: ${e.message}`, "err");
      adminToken = "";
    } finally {
      document.getElementById("auth-btn").disabled = false;
    }
  }

  // ── API 호출 헬퍼 ──────────────────────────────────────────────────────────

  function apiFetch(path, options = {}) {
    return fetch(API + path, {
      ...options,
      headers: {
        "Authorization": `Bearer ${adminToken}`,
        "Content-Type": "application/json",
        ...(options.headers || {}),
      },
    });
  }

  // ── 유저 목록 렌더 ─────────────────────────────────────────────────────────

  function renderUsers(data) {
    document.getElementById("user-count").textContent = data.total;
    const tbody = document.getElementById("user-tbody");

    if (!data.users.length) {
      tbody.innerHTML = `<tr><td colspan="3" class="empty">유저 없음</td></tr>`;
      return;
    }

    tbody.innerHTML = data.users.map(u => `
      <tr>
        <td title="${u.google_id}">${u.email}</td>
        <td><span class="tag ${u.delivery_type}">${u.delivery_type}</span></td>
        <td>${u.created_at.slice(0, 10)}</td>
      </tr>
    `).join("");
  }

  // ── 행동 로그 렌더 ─────────────────────────────────────────────────────────

  async function loadLogs() {
    const tbody = document.getElementById("log-tbody");
    tbody.innerHTML = `<tr><td colspan="4" class="empty"><span class="spinner"></span>로딩 중...</td></tr>`;

    try {
      const res = await apiFetch("/admin/logs");
      const data = await res.json();
      document.getElementById("log-count").textContent = data.total;

      if (!data.logs.length) {
        tbody.innerHTML = `<tr><td colspan="4" class="empty">오늘 로그 없음</td></tr>`;
        return;
      }

      tbody.innerHTML = data.logs.slice(0, 50).map(l => `
        <tr>
          <td style="font-size:0.75rem;color:#666;">${l.user_id.slice(0, 8)}…</td>
          <td><span class="tag ${l.event_type}">${l.event_type}</span></td>
          <td>${l.keyword}</td>
          <td style="font-size:0.75rem;color:#666;">${l.logged_at.slice(11, 19)}</td>
        </tr>
      `).join("");
    } catch (e) {
      tbody.innerHTML = `<tr><td colspan="4" class="empty">로드 실패: ${e.message}</td></tr>`;
    }
  }

  // ── 파이프라인 실행 ────────────────────────────────────────────────────────

  async function runPipeline() {
    const userId = document.getElementById("pipeline-user-id").value.trim();
    if (!userId) return;

    const btn = document.getElementById("run-btn");
    const resultEl = document.getElementById("pipeline-result");
    btn.disabled = true;
    btn.innerHTML = `<span class="spinner"></span>실행 중...`;
    resultEl.style.display = "none";
    showMsg("pipeline-msg", "", "");

    try {
      const res = await apiFetch(`/admin/pipeline/run?user_id=${encodeURIComponent(userId)}`, {
        method: "POST",
      });
      const data = await res.json();

      if (res.ok) {
        showMsg("pipeline-msg", `✓ 파이프라인 완료 — 주제 ${data.topics?.length ?? 0}개`, "ok");
        resultEl.textContent = JSON.stringify(data, null, 2);
        resultEl.style.display = "block";
      } else {
        showMsg("pipeline-msg", `실패: ${data.detail || res.status}`, "err");
      }
    } catch (e) {
      showMsg("pipeline-msg", `오류: ${e.message}`, "err");
    } finally {
      btn.disabled = false;
      btn.textContent = "실행";
    }
  }

  // ── 유틸 ──────────────────────────────────────────────────────────────────

  function showMsg(id, text, type) {
    const el = document.getElementById(id);
    el.className = `msg ${type}`;
    el.textContent = text;
  }

  // 엔터키로 인증
  document.getElementById("secret-input")
    .addEventListener("keydown", e => { if (e.key === "Enter") authenticate(); });
</script>
</body>
</html>
